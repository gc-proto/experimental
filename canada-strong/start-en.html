---
layout: null
---
{%- assign t = site.data.canada_strong_en -%}
{%- assign p = t.start -%}
<!DOCTYPE html>
<!--[if lt IE 9]><html class="no-js lt-ie9" lang="{{ t.lang }}" dir="ltr"><![endif]-->
<!--[if gt IE 8]><!--><html class="no-js" lang="{{ t.lang }}" dir="ltr"><!--<![endif]-->
	<head>
		<meta charset="utf-8">
		<!-- Web Experience Toolkit (WET) / Boîte à outils de l'expérience Web (BOEW) wet-boew.github.io/wet-boew/License-en.html / wet-boew.github.io/wet-boew/Licence-fr.html -->
		<title>{{ p.title }} - Canada.ca</title>
		<meta content="width=device-width,initial-scale=1" name="viewport">
		<!-- Meta data -->
		<meta name="description" content="{{ p.description }}">
		<!-- Meta data-->
		<!-- Load closure template scripts -->
		<script src="https://www.canada.ca/etc/designs/canada/cdts/gcweb/v5_0_2/cdts/compiled/soyutils.js"></script>
		<script src="https://www.canada.ca/etc/designs/canada/cdts/gcweb/v5_0_2/cdts/compiled/wet-en.js"></script>
		<noscript>
			<!-- Write closure fall-back static file -->
			<!-- refTop.html -->
		</noscript>
		<!-- Write closure template -->
		<script>
			document.write(wet.builder.refTop({
				"cdnEnv": "esdcprod"
			}));
		</script>
	</head>
	<body vocab="https://schema.org/" typeof="WebPage">
		<div id="def-top">
			<!-- Write closure fall-back static file -->
			<!-- top-en.html -->
		</div>
		<!-- Write closure template -->
		<script>
			var defTop = document.getElementById("def-top");
			defTop.outerHTML = wet.builder.top({
				"lngLinks": [{
					"lang": "fr",
					"href": "start-fr.html",
					"text": "{{ t.alt_lang_text }}"
				}],
				"breadcrumbs": [{% for b in t.breadcrumbs %}{
					"title": "{{ b.title }}",
					"href": "{{ b.href }}"
				}{% unless forloop.last %},{% endunless %}{% endfor %}],
				"cdnEnv": "esdcprod"
			});
		</script>
		<main property="mainContentOfPage" typeof="WebPageElement">

			<div class="container">
				<h1 property="name" id="wb-cont">{{ p.h1 }}</h1>

				<div class="row">
					<div class="col-md-8">
						<p>{{ p.intro }}</p>

						<ul class="list-unstyled mrgn-tp-md">
							{% for opt in p.options %}<li class="mrgn-bttm-md">
								<p class="h5 mrgn-tp-0 mrgn-bttm-sm">{{ opt.label }}</p>
								<p class="mrgn-bttm-sm">{{ opt.description }}</p>
								<a href="{{ opt.href }}" class="btn btn-primary">{{ opt.cta }}</a>
							</li>
							{% endfor %}
						</ul>
					</div>
				</div>
			</div>

			<div class="container">
				<div id="def-preFooter">
					<!-- Write closure fall-back static file -->
					<!-- preFooter-en.html -->
				</div>
			</div>
			<!-- Write closure template -->
			<script>
				var defPreFooter = document.getElementById("def-preFooter");
				defPreFooter.outerHTML = wet.builder.preFooter({
					"dateModified": "{{ t.date_modified }}",
					"showShare": false,
					"cdnEnv": "esdcprod"
				});
			</script>
		</main>
		<div id="def-footer">
			<!-- Write closure fall-back static file -->
			<!-- footer-en.html -->
		</div>
		<!-- Write closure template -->
		<script>
			var defFooter = document.getElementById("def-footer");
			defFooter.outerHTML = wet.builder.footer({
				"cdnEnv": "esdcprod"
			});
		</script>
		<!-- Write closure template -->
		<script>
			document.write(wet.builder.refFooter({
				"cdnEnv": "esdcprod"
			}));
		</script>
	</body>
</html>
