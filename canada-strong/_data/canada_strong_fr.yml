# ─────────────────────────────────────────────────────────────────────────────
# Outil de soutien tarifaire Canada fort — texte de l'interface en français.
#
# CE FICHIER CONTIENT DES MOTS, PAS DES PROGRAMMES.
#
# Les programmes affichés selon les réponses proviennent de
# _data/tariff_tool_links.csv, partagé avec l'anglais : ce fichier porte les
# colonnes name_fr et url_fr. Pour ajouter, déplacer, retirer ou relier un
# programme, modifiez le CSV — rien ici ne change.
#
# Même structure que _data/canada_strong_en.yml. Les clés (marker, csv, status)
# restent en anglais : ce sont des identifiants, pas du texte affiché.
# ─────────────────────────────────────────────────────────────────────────────

lang: fr
date_modified: "2026-09-02"
alt_lang_text: "English"

breadcrumbs:
  - title: "Canada.ca"
    href: "https://www.canada.ca/fr.html"
  - title: "Réponse du Canada aux droits de douane américains"
    href: "https://www.canada.ca/fr/ministere-finances/programmes/politiques-finances-echanges-internationaux/reponse-canada-droits-douane-americains.html"

# ═══ PONT DE VOCABULAIRE ═════════════════════════════════════════════════════
# Nos marqueurs de réponse à gauche, les valeurs du CSV à droite. Les valeurs
# `csv` sont identiques à celles du fichier anglais : c'est le même CSV.
needs:
  - {marker: need-fin, csv: financing,      heading: "Financement"}
  - {marker: need-liq, csv: liquidity,      heading: "Liquidités"}
  - {marker: need-tra, csv: transformation, heading: "Transformation et projets d'immobilisations"}
  - {marker: need-wrk, csv: workforce,      heading: "Maintien en poste et recyclage de la main-d'œuvre"}

# La dernière réponse de la question 1 n'est pas un besoin en soi — elle
# affiche tous les besoins à la fois. Elle n'a pas d'entrée dans `needs:` (cette
# liste génère un panneau par besoin) ni de valeur `csv` (aucune ligne n'y est
# classée). Elle est nommée ici pour que le gabarit et les tests partagent une
# seule définition plutôt que de coder le marqueur en dur.
#
# Sous cette réponse, un programme apparaît une seule fois, classé sous le
# PREMIER besoin que sa colonne `need` énumère. L'ordre à l'intérieur d'une
# cellule séparée par des points-virgules est donc significatif :
# `financing;liquidity` classe le Prêt Pivoter pour croître sous Financement,
# `liquidity;transformation` classe les lignes de l'IRRT sous Liquidités.
# Réordonner la cellule déplace le programme d'un titre à l'autre.
all_needs_marker: need-all

sectors:
  - {marker: sec-forestry, csv: forestry-and-lumber, heading: "Foresterie et bois d'œuvre"}
  - {marker: sec-steel,    csv: steel-and-aluminum,  heading: "Acier et aluminium"}
  - {marker: sec-agri,     csv: agriculture,         heading: "Agriculture"}

# L'Ontario correspond à deux ADR, pas une seule : FedNor dessert le nord,
# FedDev Ontario le sud. Les valeurs csv: sont des identifiants et restent en
# anglais ici, comme dans le fichier anglais.
#
# `rda` / `rda_url` sont le nom et le site de l'agence elle-même — pas le
# programme tarifaire régional, qui est `wz-rg-*` ci-dessus et déjà un lien
# sous « Programmes pour votre région ». Noms tirés du <h1> de chaque page,
# adresses vérifiées en direct (2026-09-03).
regions:
  - {marker: reg-atl,   csv: "Atlantic",          rda: "Agence de promotion économique du Canada atlantique",         rda_url: "https://www.canada.ca/fr/promotion-economique-canada-atlantique.html"}
  - {marker: reg-qc,    csv: "Quebec",            rda: "Développement économique Canada pour les régions du Québec",  rda_url: "https://www.canada.ca/fr/developpement-economique-regions-quebec.html"}
  - {marker: reg-on-n,  csv: "Northern Ontario",  rda: "Agence fédérale de développement économique pour le Nord de l'Ontario", rda_url: "https://fednor.canada.ca/fr"}
  - {marker: reg-on-s,  csv: "Southern Ontario",  rda: "Agence fédérale de développement économique pour le Sud de l'Ontario",  rda_url: "https://feddev-ontario.canada.ca/fr"}
  - {marker: reg-pr,    csv: "Prairies",          rda: "Développement économique Canada pour les Prairies",            rda_url: "https://www.canada.ca/fr/developpement-economique-prairies.html"}
  - {marker: reg-bc,    csv: "British Columbia",  rda: "PacifiCan",                                                    rda_url: "https://www.canada.ca/fr/developpement-economique-pacifique.html"}
  - {marker: reg-nor,   csv: "North",             rda: "Agence canadienne de développement économique du Nord",       rda_url: "https://www.canada.ca/fr/developpement-economique-nord.html"}

# La plupart des lignes du CSV ont une colonne `size` vide et s'affichent pour
# toutes les tailles — cette liste ne compte que pour la rare ligne qui se
# restreint elle-même, comme le Crédit pour les grandes entreprises
# (`size: large`) ou la répartition NIA/PME d'Agri-marketing. size-nonprofit
# a son propre compartiment `nonprofit` ici, distinct de under-1m — un
# programme peut maintenant s'afficher pour les OSBL sans s'afficher aussi
# pour toute entreprise sous 1 M$, et inversement. (Ses insignes
# d'admissibilité sont un mécanisme différent, basé directement sur le
# marqueur dans eligibility_rules ci-dessous, et empruntent toujours ceux de
# size-under1m comme choix provisoire — inchangé par cette décision.)
sizes:
  - {marker: size-under1m,   csv: "under-1m"}
  - {marker: size-nonprofit, csv: "nonprofit"}
  - {marker: size-1to5m,     csv: "1to5m"}
  - {marker: size-5mplus,    csv: "5mplus"}
  - {marker: size-large,     csv: "large"}

exclude_statuses: "no-page disputed"

# ═══ PAGE DE DÉPART ══════════════════════════════════════════════════════════
