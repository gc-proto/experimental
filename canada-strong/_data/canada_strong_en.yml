# ─────────────────────────────────────────────────────────────────────────────
# Canada Strong tariff support tool — English interface text.
#
# THIS FILE HOLDS WORDS, NOT PROGRAMS.
#
# Which programs appear for which answers lives in _data/tariff_tool_links.csv,
# one row per program. To add, move, retire or re-link a program, edit that CSV
# in a spreadsheet — nothing here needs to change.
#
# What lives here:
#   needs / sectors / regions  the bridge between our answer markers and the
#                              CSV's own need / sector / region vocabulary
#   sizes                      the same, for the rare CSV row that restricts
#                              itself by size (see the `size` column)
#   questions                  the four questions and their answers
#   labels                     headings the template builds results out of
#
# French is _data/canada_strong_fr.yml — the same shape, translated. The CSV is
# shared between both: it carries name_fr and url_fr columns.
# ─────────────────────────────────────────────────────────────────────────────

lang: en
date_modified: "2026-09-02"
alt_lang_text: "Français"

breadcrumbs:
  - title: "Canada.ca"
    href: "https://www.canada.ca/en.html"
  - title: "Canada's response to US tariffs"
    href: "https://www.canada.ca/en/department-finance/programs/international-trade-finance-policy/canadas-response-us-tariffs.html"

# ═══ VOCABULARY BRIDGE ═══════════════════════════════════════════════════════
# Our answer markers on the left, the CSV's values on the right. Change a CSV
# value here if you rename one in the spreadsheet.
needs:
  - {marker: need-fin, csv: financing,      heading: "Financing"}
  - {marker: need-liq, csv: liquidity,      heading: "Liquidity"}
  - {marker: need-tra, csv: transformation, heading: "Transformation and capital projects"}
  - {marker: need-wrk, csv: workforce,      heading: "Workforce retention and retraining"}

# Sectors that have rows of their own in the CSV. Manufacturing and the
# U.S.-exporter answer are deliberately absent: they have no sector-specific
# stream, so they see the sector-agnostic results only.
sectors:
  - {marker: sec-forestry, csv: forestry-and-lumber, heading: "Forestry and lumber"}
  - {marker: sec-steel,    csv: steel-and-aluminum,  heading: "Steel and aluminum"}
  - {marker: sec-agri,     csv: agriculture,         heading: "Agriculture"}

# Ontario is two RDAs, not one, so it is two separate answers rather than a
# single "Ontario" that shows both. FedNor serves Northern Ontario; FedDev
# Ontario serves Southern Ontario. Split at Muskoka, per
# https://ised-isde.canada.ca/site/ised/en/canadas-regional-development-agencies
#
# `rda` / `rda_url` are the agency's own name and homepage — not the
# region's tariff-specific program, which is `wz-rg-*` above and already a
# link in "Programs for your region". Names are each page's own <h1>, URLs
# checked live (2026-09-03), same convention as the CSV's `fr_source`.
regions:
  - {marker: reg-atl,   csv: "Atlantic",          rda: "Atlantic Canada Opportunities Agency",              rda_url: "https://www.canada.ca/en/atlantic-canada-opportunities.html"}
  - {marker: reg-qc,    csv: "Quebec",            rda: "Canada Economic Development for Quebec Regions",    rda_url: "https://www.canada.ca/en/economic-development-quebec-regions.html"}
  - {marker: reg-on-n,  csv: "Northern Ontario",  rda: "Federal Economic Development Agency for Northern Ontario", rda_url: "https://fednor.canada.ca/en"}
  - {marker: reg-on-s,  csv: "Southern Ontario",  rda: "Federal Economic Development Agency for Southern Ontario", rda_url: "https://feddev-ontario.canada.ca/en"}
  - {marker: reg-pr,    csv: "Prairies",          rda: "Prairies Economic Development Canada",               rda_url: "https://www.canada.ca/en/prairies-economic-development.html"}
  - {marker: reg-bc,    csv: "British Columbia",  rda: "PacifiCan",                                          rda_url: "https://www.canada.ca/en/pacific-economic-development.html"}
  - {marker: reg-nor,   csv: "North",             rda: "Canadian Northern Economic Development Agency",      rda_url: "https://www.canada.ca/en/northern-economic-development.html"}

# Most CSV rows have a blank `size` column and show for every size — this
# bridge only matters for the rare row that restricts itself, like the Large
# Enterprise Tariff Loan (`size: large`) or AgriMarketing's NIA/SME split.
# size-nonprofit gets its own `nonprofit` bucket here, separate from
# under-1m — a program can now be shown to non-profits without also being
# shown to every business under $1M, or vice versa. (Its eligibility badges
# are a different mechanism, gated directly on the marker in
# eligibility_rules below, and still borrow size-under1m's as a
# placeholder — that decision is unaffected by this one.)
sizes:
  - {marker: size-under1m,   csv: "under-1m"}
  - {marker: size-nonprofit, csv: "nonprofit"}
  - {marker: size-1to5m,     csv: "1to5m"}
  - {marker: size-5mplus,    csv: "5mplus"}
  - {marker: size-large,     csv: "large"}

# CSV rows carrying these statuses are never rendered.
#   no-page   the research found no program by that name
#   disputed  the deck named a program the department does not route to
# Removing a status here brings those rows back — that is the whole fix for the
# forestry transformation cell, which the deck got wrong.
exclude_statuses: "no-page disputed"

# ═══ START PAGE ══════════════════════════════════════════════════════════════
start:
  title: "Find support for tariff impacts"
  description: "Find the federal supports available to businesses, employers and workers affected by United States tariffs."
  h1: "Find support for tariff impacts"
  intro: "Find the support you need"
  options:
    - label: "I am a business or employer"
      description: "Answer four questions about need, region, size and sector"
      cta: "Build me a short list"
      href: "business-en.html"
    - label: "I am a worker"
      description: "Reach income support, skills training and student aid directly"
      cta: "Show me worker supports"
      # Placeholder: the live Canada.ca page stands in until a worker prototype exists
      href: "https://www.canada.ca/en/department-finance/programs/international-trade-finance-policy/canadas-response-us-tariffs/support-canadian-workers-employers.html#a1"
    - label: "I want more information"
      description: "General overview of Canada's response to U.S. tariffs"
      cta: "Give me the overview"
      href: "https://www.canada.ca/en/government/united-states-canada.html"

# ═══ BUSINESS WIZARD ═════════════════════════════════════════════════════════
business:
  title: "Find support for your business"
  description: "Answer four questions to get a shortlist of federal programs for businesses affected by United States tariffs."
  h1: "Find support for your business"
  intro: "Answer four questions and we will show you the programs that fit your need, your region, your size and your sector."
  questions_heading: "Tell us about your business"
  results_heading: "Programs that match your answers"
  back_link: "Start over"
  back_href: "start-en.html"

  # Headings the template assembles around the CSV rows.
  labels:
    # French puts a space before a colon; English does not.
    heading_sep: ": "
    agnostic_suffix: "open to all sectors"
    region_heading: "Programs for your region"
    hub_heading: "Where these programs are listed"
    hub_body: "These hubs are the departments' own lists. They are kept current, so check them if something here looks out of date."
    rda_prefix: "Get additional support from: "

  # ── The four questions ─────────────────────────────────────────────────────
  # `clears` lists every marker this question resets before applying the new
  # answer, so changing an earlier answer cannot leave a stale panel behind.
  # `next` is the sub-question this question appends; the last one has none and
  # reveals the results instead.
  questions:
    - id: question-1
      legend: "Question 1 of 4: What do you need right now?"
      clears: "need-fin need-liq need-tra need-wrk reg-atl reg-qc reg-on-n reg-on-s reg-pr reg-bc reg-nor size-under1m size-nonprofit size-1to5m size-5mplus size-large sec-forestry sec-steel sec-mfg sec-agri"
      next: "question-2"
      options:
        - {marker: need-fin, label: "Financing to keep operating or grow"}
        - {marker: need-liq, label: "Liquidity for a tariff-driven cash-flow gap"}
        - {marker: need-tra, label: "Transformation or capital project"}
        - {marker: need-wrk, label: "Workforce retention and retraining"}

    - id: question-2
      legend: "Question 2 of 4: Where is your business mainly located?"
      clears: "reg-atl reg-qc reg-on-n reg-on-s reg-pr reg-bc reg-nor size-under1m size-nonprofit size-1to5m size-5mplus size-large sec-forestry sec-steel sec-mfg sec-agri"
      next: "question-3"
      options:
        - {marker: reg-atl,  label: "Atlantic"}
        - {marker: reg-qc,   label: "Quebec"}
        - {marker: reg-on-n, label: "Northern Ontario (including Parry Sound)"}
        - {marker: reg-on-s, label: "Southern and Eastern Ontario"}
        - {marker: reg-pr,   label: "Manitoba, Saskatchewan, Alberta"}
        - {marker: reg-bc,   label: "British Columbia"}
        - {marker: reg-nor,  label: "The North"}

    - id: question-3
      legend: "Question 3 of 4: What is your size and revenue?"
      clears: "size-under1m size-nonprofit size-1to5m size-5mplus size-large sec-forestry sec-steel sec-mfg sec-agri"
      next: "question-4"
      options:
        - {marker: size-under1m, label: "Under $1 million in annual revenue"}
        # The Regional Tariff Response Initiative is also open to "non-profit
        # organizations, industry and sector associations, boards of trade,
        # and provincial entities that support affected businesses" — the
        # provincial-entities part is left out of the label on purpose. This
        # answer maps to the same eligibility_rules outcomes as
        # size-under1m below, until we're told otherwise.
        - {marker: size-nonprofit, label: "Non-profit, association, board of trade"}
        - {marker: size-1to5m,   label: "$1 million to $5 million"}
        - {marker: size-5mplus,  label: "$5 million or more with 10 or more full-time employees"}
        - {marker: size-large,   label: "Larger enterprise ($150 million or more in annual revenue)"}

    - id: question-4
      legend: "Question 4 of 4: What is your sector and tariff impact?"
      clears: "sec-forestry sec-steel sec-mfg sec-agri"
      next: null
      options:
        - {marker: sec-forestry, label: "Forestry and softwood lumber"}
        - {marker: sec-steel,    label: "Steel, aluminium and copper"}
        - {marker: sec-mfg,      label: "Other manufacturing and exporters"}
        - {marker: sec-agri,     label: "Agriculture, agri-food, fish and seafood"}
