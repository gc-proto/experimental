# ─────────────────────────────────────────────────────────────────────────────
# Canada Strong tariff support tool — all English text and all routing logic.
#
# Source: canada-strong-tariff-tool-LB_Sept_01.pdf (5 slides, Sept 1 2026).
#
# Nothing in canada-strong/*.html is hardcoded copy — to change what the wizard
# says or what it returns, change this file. A French version is a copy of this
# file as _data/canada_strong_fr.yml plus `fr` pages pointing at it.
#
# Three things live here:
#   questions:  the four business questions and their answers
#   panels:     the result panels and the programs inside them
#   matrix:     which combination of answers reveals which panel
#
# Every program link is a placeholder (#) in this pass — see `todo` below.
# ─────────────────────────────────────────────────────────────────────────────

lang: en
date_modified: "2026-09-02"

# Where the CDTS language toggle points. Until French pages exist this is the
# live Canada.ca French landing page.
alt_lang_href: "https://www.canada.ca/fr/ministere-finances/programmes/politiques-finances-echanges-internationaux/reponse-canada-droits-douane-americains.html"
alt_lang_text: "Français"

breadcrumbs:
  - title: "Canada.ca"
    href: "https://www.canada.ca/en.html"
  - title: "Canada's response to US tariffs"
    href: "https://www.canada.ca/en/department-finance/programs/international-trade-finance-policy/canadas-response-us-tariffs.html"

prototype_notice:
  heading: "Prototype"
  # Each page supplies its own body under `notice` below.

# ═══ START PAGE (slide 1) ════════════════════════════════════════════════════
start:
  title: "Find support for tariff impacts"
  description: "Find the federal supports available to businesses, employers and workers affected by United States tariffs."
  h1: "Find support for tariff impacts"
  notice: "This is a design prototype built from a slide deck. The worker path and the information hub link out to the live Canada.ca pages."
  intro: "What brings you here today?"
  cards:
    - heading: "I am a business or employer"
      bullets:
        - "Answer four questions about need, region, size and sector"
        - "Get a shortlist of financing, liquidity, project and workforce programs"
      cta: "Go to the business path"
      href: "business-en.html"
    - heading: "I am a worker"
      bullets:
        - "Reach income support, skills training and student aid directly"
        - "No eligibility questionnaire required to browse"
      cta: "Go to the worker path"
      # Placeholder: the live Canada.ca page stands in until a worker prototype exists
      href: "https://www.canada.ca/en/department-finance/programs/international-trade-finance-policy/canadas-response-us-tariffs/support-canadian-workers-employers.html#a1"
    - heading: "I want more information"
      bullets:
        - "General overview of Canada's response to U.S. tariffs"
        - "Link to the Canada.ca tariff response landing page"
      cta: "Go to the information hub"
      href: "https://www.canada.ca/en/department-finance/programs/international-trade-finance-policy/canadas-response-us-tariffs.html"

# ═══ BUSINESS WIZARD (slides 2, 3, 4) ════════════════════════════════════════
business:
  title: "Find support for your business"
  description: "Answer four questions to get a shortlist of federal programs for businesses affected by United States tariffs."
  h1: "Find support for your business"
  notice: "This is a design prototype. Every program name in the results links to a placeholder, not to the real program page."
  intro: "Answer four questions and we will show you the programs that fit your need, your region, your size and your sector."
  questions_heading: "Tell us about your business"
  results_heading: "Programs that match your answers"
  back_link: "Start over"
  back_href: "start-en.html"

  # ── The four questions ─────────────────────────────────────────────────────
  # `clears` lists every marker this question resets before applying the new
  # answer, so changing an earlier answer cannot leave a stale panel behind.
  # `next` is the sub-question this question appends; the last one has none and
  # reveals the results instead.
  questions:
    - id: question-1
      legend: "Question 1 of 4: What do you need right now?"
      clears: "need-fin need-liq need-tra need-wrk reg-atl reg-qc reg-on reg-pr reg-bc reg-nor size-under1m size-1to5m size-5mplus size-large sec-forestry sec-steel sec-mfg sec-agri sec-usexport"
      next: "question-2"
      options:
        - {marker: need-fin, label: "Financing to keep operating or grow"}
        - {marker: need-liq, label: "Liquidity for a tariff-driven cash-flow gap"}
        - {marker: need-tra, label: "Transformation or capital project"}
        - {marker: need-wrk, label: "Workforce retention and retraining"}

    - id: question-2
      legend: "Question 2 of 4: Where is your business located?"
      clears: "reg-atl reg-qc reg-on reg-pr reg-bc reg-nor size-under1m size-1to5m size-5mplus size-large sec-forestry sec-steel sec-mfg sec-agri sec-usexport"
      next: "question-3"
      options:
        - {marker: reg-atl, label: "Atlantic"}
        - {marker: reg-qc,  label: "Quebec"}
        - {marker: reg-on,  label: "Ontario"}
        - {marker: reg-pr,  label: "Prairies"}
        - {marker: reg-bc,  label: "British Columbia"}
        - {marker: reg-nor, label: "The North"}

    - id: question-3
      legend: "Question 3 of 4: What is your size and revenue?"
      clears: "size-under1m size-1to5m size-5mplus size-large sec-forestry sec-steel sec-mfg sec-agri sec-usexport"
      next: "question-4"
      options:
        - {marker: size-under1m, label: "Under $1 million in annual revenue"}
        - {marker: size-1to5m,   label: "$1 million to $5 million and 3 or more years operating"}
        - {marker: size-5mplus,  label: "$5 million or more with 10 or more full-time employees"}
        - {marker: size-large,   label: "Large enterprise"}

    - id: question-4
      legend: "Question 4 of 4: What is your sector and tariff impact?"
      clears: "sec-forestry sec-steel sec-mfg sec-agri sec-usexport"
      next: null
      options:
        - {marker: sec-forestry, label: "Forestry and softwood lumber"}
        - {marker: sec-steel,    label: "Steel, aluminium and copper"}
        - {marker: sec-mfg,      label: "Manufacturing and other exporters"}
        - {marker: sec-agri,     label: "Agriculture, agri-food, fish and seafood"}
        - {marker: sec-usexport, label: "Exporting to the U.S. with 15% or more of revenue from U.S. exports"}

  # ── Result panels, in the order they appear ────────────────────────────────
  # `always: true` means the panel is not filtered — it shows with every result.
  panels:

    # Sector rows from slide 4
    - id: wz-liq-forestry
      heading: "Forestry and lumber: liquidity"
      programs:
        - {name: "BDC Forestry Liquidity"}
        - {name: "BDC Softwood Lumber Guarantee"}

    - id: wz-tra-forestry
      heading: "Forestry and lumber: transformation"
      programs:
        - {name: "BDC Forestry Transformation"}

    - id: wz-fin-agri
      heading: "Agriculture: financing"
      programs:
        - {name: "Canadian Agricultural Loans Act", note: "Loan guarantees for farmers and co-operatives."}
        - {name: "FCC term loan support"}

    - id: wz-liq-agri
      heading: "Agriculture: liquidity"
      programs:
        - {name: "AAFC Advance Payments Program"}
        - {name: "FCC Trade Disruption Program"}
        - {name: "AgriStability"}
        - {name: "AgriInvest and Price Pooling"}

    - id: wz-tra-agri
      heading: "Agriculture: transformation"
      programs:
        - {name: "AAFC AgriMarketing Market Diversification"}
        - {name: "AAFC Agricultural Trade Commissioner Service"}
        - {name: "AAFC Canada Brand and the agri-food single window"}

    - id: wz-liq-steel
      heading: "Steel and aluminum: liquidity"
      programs:
        - {name: "BDC Steel and Aluminium"}

    - id: wz-agnostic-only
      heading: "No stream specific to your sector"
      body: "There is no program stream built for your sector and this need. The programs below are open to all sectors and are where you should start."
      programs: []

    # Sector-agnostic column from slide 4
    - id: wz-need-fin
      heading: "Financing: open to all sectors"
      programs:
        - {name: "BDC Pivot to Grow"}
        - {name: "BDC Equipment Financing"}
        - {name: "EDC Working Capital Support"}
        - {name: "EDC Export Financing Loans"}

    - id: wz-need-liq
      heading: "Liquidity: open to all sectors"
      programs:
        - {name: "BDC Pivot to Grow Liquidity"}
        - {name: "CEEFC Large Enterprise Tariff Loan Facility"}
        - {name: "RDA Regional Tariff Response Initiative"}

    - id: wz-need-tra
      heading: "Transformation and capital projects: open to all sectors"
      programs:
        - {name: "ISED Strategic Response Fund"}
        - {name: "RDA Regional Tariff Response Initiative"}
        - {name: "EDC Market Diversification Support"}
        - {name: "GAC Trade Commissioner Service"}

    # Slide 3 — the employer workforce supports, shown when workforce is the need
    - id: wz-need-wrk
      heading: "Workforce retention and retraining"
      body: "When workforce retention and retraining is your need, these are the programs to start with."
      programs:
        - {name: "Work-Sharing agreement", note: "Measures for employers experiencing a temporary reduction in business."}
        - {name: "Worker Retention Grant", note: "Enables employers with an approved and implemented Work-Sharing agreement to provide additional income support to their EI eligible employees who are working reduced hours and are on training."}
        - {name: "ESDC Rapid Response Supports for Workers and Employers", note: "Up to $1,000 per participant. LMDA-funded provincial programs deliver the training itself."}
        - {name: "Student Work Placement Program", note: "Apply for wage subsidies to hire post-secondary students."}

    # Regional development agencies (slide 2, question 2)
    - id: wz-rda-atl
      heading: "Your regional development agency: Atlantic"
      programs: [{name: "Atlantic Canada Opportunities Agency (ACOA)"}]
      footnote: "Regional criteria and intake dates vary."
    - id: wz-rda-qc
      heading: "Your regional development agency: Quebec"
      programs: [{name: "Canada Economic Development for Quebec Regions (CED)"}]
      footnote: "Regional criteria and intake dates vary."
    - id: wz-rda-on
      heading: "Your regional development agency: Ontario"
      programs:
        - {name: "FedDev Ontario", note: "Southern Ontario."}
        - {name: "FedNor", note: "Northern Ontario."}
      footnote: "Regional criteria and intake dates vary."
    - id: wz-rda-pr
      heading: "Your regional development agency: Prairies"
      programs: [{name: "Prairies Economic Development Canada (PrairiesCan)"}]
      footnote: "Regional criteria and intake dates vary."
    - id: wz-rda-bc
      heading: "Your regional development agency: British Columbia"
      programs: [{name: "Pacific Economic Development Canada (PacifiCan)"}]
      footnote: "Regional criteria and intake dates vary."
    - id: wz-rda-nor
      heading: "Your regional development agency: the North"
      programs: [{name: "Canadian Northern Economic Development Agency (CanNor)"}]
      footnote: "Regional criteria and intake dates vary."

    # Extra resources
    - id: wz-agpal
      heading: "More agriculture resources"
      programs: [{name: "AgPal"}]

    - id: wz-bbf
      heading: "More business supports"
      always: true
      programs: [{name: "Business Benefits Finder (ISED)"}]

  # ── Eligibility checklist (slide 2, bottom) ────────────────────────────────
  # Criteria with one badge always show that badge. Criteria with several show
  # whichever one the `matrix` rules below reveal for the chosen answers.
  eligibility:
    heading: "Eligibility criteria"
    body: "Programs on this page commonly apply these criteria. This is a guide, not a decision — the program you apply to makes the final determination."
    criteria:
      - text: "Canadian-incorporated"
        badges:
          - {status: review, label: "Needs review"}
      - text: "3 or more years operating"
        badges:
          - {status: met,    label: "Met",          class: wz-yrs-met}
          - {status: review, label: "Needs review", class: wz-yrs-review}
      - text: "$1 million or more in annual revenue"
        badges:
          - {status: met,    label: "Met",     class: wz-rev-met}
          - {status: notmet, label: "Not met", class: wz-rev-notmet}
      - text: "Positive cash flow"
        badges:
          - {status: review, label: "Needs review"}
      - text: "15% or more of revenue from U.S. exports, or a 10% tariff-driven revenue decline or cost increase"
        badges:
          - {status: met,    label: "Met",          class: wz-us-met}
          - {status: review, label: "Needs review", class: wz-us-review}
    large_note: "As a large enterprise, the CEEFC Large Enterprise Tariff Loan Facility is the stream built for your size."

  # ── The matrix: which answers reveal which panel ───────────────────────────
  # `when` is one or more answer markers that must all be selected.
  # `show` is the panel or badge revealed. `display` defaults to block.
  # To change what a combination returns, change one line here.
  matrix:

    # Sector-agnostic column — keyed on the need alone
    - {when: "need-fin", show: wz-need-fin}
    - {when: "need-liq", show: wz-need-liq}
    - {when: "need-tra", show: wz-need-tra}
    - {when: "need-wrk", show: wz-need-wrk}

    # Slide 4 matrix — rows are sectors, columns are needs, all 12 cells present
    #                        FINANCING          LIQUIDITY          TRANSFORMATION     WORKFORCE
    - {when: "sec-forestry need-fin", show: wz-agnostic-only}
    - {when: "sec-forestry need-liq", show: wz-liq-forestry}
    - {when: "sec-forestry need-tra", show: wz-tra-forestry}
    - {when: "sec-forestry need-wrk", show: wz-agnostic-only}

    - {when: "sec-agri need-fin", show: wz-fin-agri}
    - {when: "sec-agri need-liq", show: wz-liq-agri}
    - {when: "sec-agri need-tra", show: wz-tra-agri}
    - {when: "sec-agri need-wrk", show: wz-agnostic-only}

    - {when: "sec-steel need-fin", show: wz-agnostic-only}
    - {when: "sec-steel need-liq", show: wz-liq-steel}
    - {when: "sec-steel need-tra", show: wz-agnostic-only}
    - {when: "sec-steel need-wrk", show: wz-agnostic-only}

    # Manufacturing and U.S. exporters have no sector row: agnostic throughout
    - {when: "sec-mfg",      show: wz-agnostic-only}
    - {when: "sec-usexport", show: wz-agnostic-only}

    # Extra resources
    - {when: "sec-agri", show: wz-agpal}

    # Regional development agency
    - {when: "reg-atl", show: wz-rda-atl}
    - {when: "reg-qc",  show: wz-rda-qc}
    - {when: "reg-on",  show: wz-rda-on}
    - {when: "reg-pr",  show: wz-rda-pr}
    - {when: "reg-bc",  show: wz-rda-bc}
    - {when: "reg-nor", show: wz-rda-nor}

    # Eligibility badges
    - {when: "size-1to5m",   show: wz-yrs-met,    display: inline-block}
    - {when: "size-under1m", show: wz-yrs-review, display: inline-block}
    - {when: "size-5mplus",  show: wz-yrs-review, display: inline-block}
    - {when: "size-large",   show: wz-yrs-review, display: inline-block}

    - {when: "size-1to5m",   show: wz-rev-met,    display: inline-block}
    - {when: "size-5mplus",  show: wz-rev-met,    display: inline-block}
    - {when: "size-large",   show: wz-rev-met,    display: inline-block}
    - {when: "size-under1m", show: wz-rev-notmet, display: inline-block}

    - {when: "sec-usexport", show: wz-us-met,    display: inline-block}
    - {when: "sec-forestry", show: wz-us-review, display: inline-block}
    - {when: "sec-steel",    show: wz-us-review, display: inline-block}
    - {when: "sec-mfg",      show: wz-us-review, display: inline-block}
    - {when: "sec-agri",     show: wz-us-review, display: inline-block}

    - {when: "size-large", show: wz-large-note}

